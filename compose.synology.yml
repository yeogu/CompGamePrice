services:
  api:
    image: compgameprice_api:latest
    environment:
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://127.0.0.1:8088}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-http://127.0.0.1:8088}
      CATALOG_ADMIN_ENABLED: ${CATALOG_ADMIN_ENABLED:-false}
      GAME_PRICE_DATABASE_PATH: /data/game_prices.db
      GAME_PRICE_CATALOG_PATH: /data/game_catalog.json
      GAME_PRICE_API_HOST: 127.0.0.1
      GAME_PRICE_PROJECT_PATH: /app
      GAME_PRICE_TRACKER_PATH: /app/game_price_tracker
      COLLECTION_STATUS_PATH: /data/collection-scheduler-status.json
      BACKUP_STATUS_PATH: /data/backup-scheduler-status.json
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
      NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
      NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
    network_mode: host
    volumes:
      - game-price-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: compgameprice_web_synology:latest
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailer:
    image: compgameprice_api:latest
    command: ["python3", "/app/tools/run_email_dispatcher.py"]
    environment:
      GAME_PRICE_DATABASE_PATH: /data/game_prices.db
      EMAIL_DISPATCH_INTERVAL_SECONDS: ${EMAIL_DISPATCH_INTERVAL_SECONDS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    network_mode: host
    volumes:
      - game-price-data:/data
    restart: unless-stopped

  collector:
    image: compgameprice_api:latest
    command: ["python3", "/app/tools/run_collection_scheduler.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      GAME_PRICE_DATABASE_PATH: /data/game_prices.db
      GAME_PRICE_CATALOG_PATH: /data/game_catalog.json
      GAME_PRICE_PROJECT_PATH: /app
      GAME_PRICE_TRACKER_PATH: /app/game_price_tracker
      COLLECTION_OUTPUT_PATH: /data/collection-snapshots
      COLLECTION_LOCK_PATH: /data/.collection-scheduler.lock
      COLLECTION_STATUS_PATH: /data/collection-scheduler-status.json
      COLLECTION_ENABLED: ${COLLECTION_ENABLED:-true}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-21600}
      COLLECTION_INITIAL_DELAY_SECONDS: ${COLLECTION_INITIAL_DELAY_SECONDS:-120}
      COLLECTION_CATALOG_BATCH_SIZE: ${COLLECTION_CATALOG_BATCH_SIZE:-30}
      COLLECTION_STEAM_DISCOVERY_LIMIT: ${COLLECTION_STEAM_DISCOVERY_LIMIT:-75}
      COLLECTION_STEAM_DISCOVERY_PAGES: ${COLLECTION_STEAM_DISCOVERY_PAGES:-4}
    network_mode: host
    volumes:
      - game-price-data:/data
    restart: unless-stopped

  backup-scheduler:
    image: compgameprice_api:latest
    command: ["python3", "/app/tools/run_backup_scheduler.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      GAME_PRICE_DATABASE_PATH: /data/game_prices.db
      GAME_PRICE_CATALOG_PATH: /data/game_catalog.json
      BACKUP_OUTPUT_PATH: /backups
      BACKUP_LOCK_PATH: /data/.backup-scheduler.lock
      BACKUP_STATUS_PATH: /data/backup-scheduler-status.json
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_INITIAL_DELAY_SECONDS: ${BACKUP_INITIAL_DELAY_SECONDS:-300}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    network_mode: host
    volumes:
      - game-price-data:/data
      - ./backups:/backups
    restart: unless-stopped

volumes:
  game-price-data:
